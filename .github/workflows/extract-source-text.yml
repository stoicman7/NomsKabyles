name: Rebuild Ismwaen from bold surname entries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-source-text.yml'
      - 'scripts/extract_source_text.py'
      - 'scripts/extract_bold_inventory.py'
      - 'scripts/rebuild_public_dictionary.py'
      - 'scripts/apply_amazigh_theme.py'
      - '*.pdf'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and source PDFs
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract PDF text and bold typography
        run: |
          python -m pip install --disable-pip-version-check pymupdf
          python scripts/extract_source_text.py
          python scripts/extract_bold_inventory.py
      - name: Rebuild dictionary from bold entries
        run: python scripts/rebuild_public_dictionary.py
      - name: Apply Amazigh visual identity
        run: python scripts/apply_amazigh_theme.py
      - name: Commit corrected dictionary and website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionary.json index.html
          if git diff --cached --quiet; then
            echo "No public changes to commit"
          else
            git commit -m "Restore all bold Kabyle surnames and Amazigh design"
            git push origin HEAD:main
          fi
      - name: Upload private editorial verification
        uses: actions/upload-artifact@v4
        with:
          name: ismwaen-bold-audit
          path: |
            extracted/bold-audit-report.json
            extracted/layout/bold-layout-report.json
          retention-days: 2
